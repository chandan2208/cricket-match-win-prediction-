version: '3.9'

services:
  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: cricket_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cricket_prediction
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - cricket_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Python ML Microservice ────────────────────────────────────────────────
  ml_service:
    build:
      context: ./ml_service
      dockerfile: Dockerfile
    container_name: cricket_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - MODEL_PATH=/app/models/trained/cricket_gbm.joblib
    volumes:
      - ml_model_data:/app/models/trained
      - ml_logs:/app/logs
    networks:
      - cricket_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Node.js API Service ───────────────────────────────────────────────────
  node_service:
    build:
      context: ./node_service
      dockerfile: Dockerfile
    container_name: cricket_node_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - MONGODB_URI=mongodb://mongodb:27017/cricket_prediction
      - ML_SERVICE_URL=http://ml_service:8000
      - ML_SERVICE_TIMEOUT=30000
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX_REQUESTS=100
    volumes:
      - node_logs:/app/logs
    networks:
      - cricket_net
    depends_on:
      mongodb:
        condition: service_healthy
      ml_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  cricket_net:
    driver: bridge

volumes:
  mongodb_data:
  ml_model_data:
  ml_logs:
  node_logs:
